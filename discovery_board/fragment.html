<div id="mechanics-discovery-board">
  <style>
    #mechanics-discovery-board .board-layout{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(230px,1fr);gap:18px;margin-top:16px}
    #mechanics-discovery-board canvas{display:block;width:100%;height:420px;touch-action:none;background:var(--background)}
    #mechanics-discovery-board .view-area{min-width:0}
    #mechanics-discovery-board .readout{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
    #mechanics-discovery-board .readout strong{display:block;font-weight:500;color:var(--foreground)}
    #mechanics-discovery-board .readout span{color:var(--muted-foreground)}
    #mechanics-discovery-board .board-status{margin:10px 0;color:var(--foreground)}
    #mechanics-discovery-board .legend{display:flex;gap:12px;flex-wrap:wrap;margin:8px 0}
    #mechanics-discovery-board .swatch{display:inline-block;width:12px;height:8px;margin-right:4px}
    #mechanics-discovery-board .source-note{margin-top:10px;color:var(--muted-foreground)}
    #mechanics-discovery-board svg.energy-chart{display:block;width:100%;height:240px;overflow:visible}
    #mechanics-discovery-board .energy-chart text{fill:var(--foreground);font-size:12px}
    #mechanics-discovery-board pre{white-space:pre-wrap;overflow-wrap:anywhere;max-height:280px;overflow:auto}
    #mechanics-discovery-board .table-responsive{margin-top:12px}
    @media(max-width:680px){#mechanics-discovery-board .board-layout{grid-template-columns:1fr}#mechanics-discovery-board canvas{height:340px}}
  </style>
  <h2>Inspect the mechanical evidence</h2>
  <div class="viz-controls">
    <label class="form-label">Experiment<select class="form-select" data-family><option value="robust">Latest robustness study</option><option value="nonlinear">Earlier nonlinear pilot</option><option value="linear">Linear revisions</option></select></label>
    <label class="form-label">Candidate<select class="form-select" data-candidate></select></label>
    <label class="form-label">Computed configuration<select class="form-select" data-state></select></label>
  </div>
  <div class="board-status" data-status aria-live="polite"></div>
  <div class="source-note text-small" data-comparison></div>
  <div class="board-layout">
    <div class="view-area">
      <canvas data-scene role="img" aria-label="Computed three-dimensional mechanical configuration. Drag to rotate, shift-drag to pan, wheel to zoom.">Computed mechanical geometry</canvas>
      <div class="viz-row"><span class="text-small">Drag: orbit | shift-drag: pan | wheel: zoom</span><button class="btn btn-ghost" type="button" data-reset>Reset camera</button><button class="btn btn-ghost" type="button" data-orbit>Rotate view</button><button class="btn btn-ghost" type="button" data-zoom-out aria-label="Zoom out">-</button><button class="btn btn-ghost" type="button" data-zoom-in aria-label="Zoom in">+</button><button class="btn" type="button" data-export>Export selected JSON</button></div>
      <div class="legend text-small" data-legend></div>
      <div class="source-note text-small" data-geometry-note></div>
      <div class="viz-controls">
        <label class="form-label">Geometry view<select class="form-select" data-geometry-view><option value="mechanical">Computed configuration</option><option value="display">Checked static 3D display</option><option value="parts">Flat solid panel kit</option></select></label>
        <label class="form-label">Export format<select class="form-select" data-print-format><option value="step">STEP CAD solids</option><option value="stl">STL print meshes</option><option value="obj">OBJ solid meshes</option></select></label>
        <a class="btn" data-print-download download>Download parts + checks</a>
      </div>
      <div class="source-note text-small" data-print-note aria-live="polite"></div>
      <svg class="energy-chart" role="img" aria-label="Energy along a straight interpolation between computed configurations" data-energy></svg>
      <div class="source-note text-small" data-energy-note></div>
    </div>
    <aside>
      <div class="readout tabular-nums" data-metrics></div>
      <div class="text-small" data-provenance></div>
      <div class="table-responsive"><table class="table table-sm"><thead data-head></thead><tbody data-body></tbody></table></div>
      <div class="table-responsive" data-spring-table><table class="table table-sm"><thead><tr><th>Ideal spring connection</th><th>Stiffness</th><th>Preload</th></tr></thead><tbody data-springs></tbody></table></div>
      <details><summary>Exact design parameters</summary><pre data-parameters></pre></details>
      <details><summary>Independent numerical checks</summary><pre data-audit></pre></details>
    </aside>
  </div>
  <script type="application/json" data-board-data>__DISCOVERY_DATA__</script>
  <script>__D3_LIBRARY__</script>
  <script>
  (()=>{
    const root=document.getElementById('mechanics-discovery-board');
    const el=name=>root.querySelector('[data-'+name+']');
    const data=JSON.parse(el('board-data').textContent);
    const canvas=el('scene'),ctx=canvas.getContext('2d');
    let family='robust',selected=null,view=null,yaw=-.65,pitch=.32,zoom=1,panX=0,panY=0,drag=null;
    const number=(v,d=3)=>Number.isFinite(v)?Number(v).toPrecision(d):'unresolved';
    const paletteCache=new Map();
    const css=name=>{if(paletteCache.has(name))return paletteCache.get(name);const probe=document.createElement('span');probe.style.color='var('+name+')';probe.style.display='none';root.append(probe);const resolved=getComputedStyle(probe).color;probe.remove();paletteCache.set(name,resolved);return resolved};
    const colors=()=>[1,2,3,4].map(i=>css('--viz-series-'+i));
    function candidates(){return data.candidates.filter(c=>c.family===family)}
    function option(select,value,label){const o=document.createElement('option');o.value=value;o.textContent=label;select.append(o)}
    function populate(){
      el('candidate').replaceChildren();const rows=candidates();rows.forEach(c=>option(el('candidate'),c.id,c.label));
      if(!rows.length){el('status').textContent='No computed candidates in this experiment.';return}
      choose((rows.find(c=>c.method==='meta'&&c.accepted)||rows[0]).id);
    }
    function choose(id){
      selected=candidates().find(c=>c.id===id)||candidates()[0];el('candidate').value=selected.id;el('state').replaceChildren();
      selected.views.forEach((v,i)=>option(el('state'),i,v.label));
      const index=Math.max(0,selected.views.findIndex(v=>v.state.classification==='minimum'));
      el('state').value=index;view=selected.views[index];yaw=-.65;pitch=.32;zoom=1;panX=0;panY=0;update();
    }
    function metric(label,value){const d=document.createElement('div'),s=document.createElement('span'),v=document.createElement('strong');s.textContent=label;v.textContent=value;d.append(s,v);el('metrics').append(d)}
    function update(){
      if(!selected||!view)return;
      el('comparison').textContent=family==='robust'?data.comparison_note:'';
      el('metrics').replaceChildren();el('body').replaceChildren();el('legend').replaceChildren();el('springs').replaceChildren();el('spring-table').hidden=family==='linear';
      if(family!=='linear'){
        const s=view.state;
        el('status').textContent=(selected.accepted?'Task accepted after numerical audit':'Task failed or unresolved')+'  |  '+view.setting+'  |  '+(s.classification==='minimum'?'local minimum in the modeled internal coordinates':'stationary configuration; not a stable minimum');
        metric('State energy',number(s.energy_N_mm,4)+' mJ');metric('First-pair localization',number(s.polarization,3));
        metric('Smallest Hessian eigenvalue',number(s.hessian_eigenvalues_normalized[0],3));metric('Axial holding force',number(s.holding_axial_force_N,3)+' N');
        metric('Clamp holding torque',number(s.holding_torque_N_mm,4)+' N mm');metric('Worst found-state bias',number(selected.result.worst_bias_N_mm,4)+' mJ');
        metric('Gradient residual',number(s.gradient_residual_normalized,2));metric('Physical test','Not performed');
        if(selected.robustness){metric('Design samples (4 selected modes)',selected.robustness.passed_trials+' / '+selected.robustness.total_trials);metric('Selected modes: lowest sampled path',number(selected.robustness.minimum_sampled_path_height_N_mm,4)+' mJ');}
        el('head').innerHTML='<tr><th>Cell</th><th>Height (mm)</th><th>Added twist (deg)</th></tr>';
        selected.design.cells.forEach((c,i)=>{const tr=document.createElement('tr');[i+1,number(c.h0_mm-s.cell_shortening_mm[i],4),number(s.cell_additional_twist_rad[i]*180/Math.PI,4)].forEach(t=>{const td=document.createElement('td');td.textContent=t;tr.append(td)});el('body').append(tr)});
        selected.design.springs.forEach((s,i)=>{const tr=document.createElement('tr'),unit=s.type==='axial'?' mm':' rad';[s.type+' rings '+s.rings.join('-'),s.k+' '+(s.type==='axial'?'N/mm':'N mm/rad'),i===0?'A '+s.offset_A+unit+' / B '+s.offset_B+unit:String(s.offset)+unit].forEach(text=>{const td=document.createElement('td');td.textContent=text;tr.append(td)});el('springs').append(tr)});
        colors().forEach((color,i)=>{const item=document.createElement('span'),sw=document.createElement('span');sw.className='swatch';sw.style.background=color;item.append(sw,document.createTextNode('Cell '+(i+1)));el('legend').append(item)});
        el('geometry-note').textContent='Actual reduced-model ring/facet coordinates. Ideal coaxial guide and spring connections are assumptions; spring routing and contact are not modeled.';
        el('energy-note').textContent='Energy along a straight interpolation between the target and opposite configurations. This is not a minimum-energy path, verified barrier, or simulated switching motion.';
      }else{
        const m=selected.metrics;el('status').textContent=(selected.accepted?'Requirements satisfied':'Requirements failed')+'  |  linear response to the applied force';
        metric('Volume proxy',number(m.volume_proxy_mm3,4)+' mm^3');metric('Loaded output travel',number(m.loaded_stroke_mm*1000,4)+' um');
        metric('Input travel',number(m.input_travel_mm*1000,4)+' um');metric('Physical test','Not performed');
        el('head').innerHTML='<tr><th>Constraint</th><th>Normalized margin</th></tr>';
        Object.entries(selected.margins).forEach(([name,value])=>{const tr=document.createElement('tr');[name.replaceAll('_',' '),number(value,3)].forEach(t=>{const td=document.createElement('td');td.textContent=t;tr.append(td)});el('body').append(tr)});
        el('legend').textContent='Solid: initial centerlines  |  dashed: displacement magnified 60x';
        el('geometry-note').textContent='Actual computed beam centerlines and Hermite deformation. Line thickness is illustrative. This is a linear loaded response, not a multistable-state discovery.';
        el('energy-note').textContent='No nonlinear energy landscape was computed for this linear model.';
      }
      el('parameters').textContent=JSON.stringify(selected.design,null,2);el('audit').textContent=JSON.stringify(selected.audit,null,2);
      el('provenance').textContent=selected.provenance;updateExport();draw();plot();
      if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{candidate:selected.id,setting:view.setting,classification:view.state.classification},privateContent:{family,release:2}}).catch(()=>{});
    }
    function updateExport(){
      const mode=el('geometry-view'),format=el('print-format').value,link=el('print-download');
      mode.querySelector('[value="parts"]').disabled=!view.print_export;mode.querySelector('[value="display"]').disabled=!view.display_export;
      if((mode.value==='parts'&&!view.print_export)||(mode.value==='display'&&!view.display_export))mode.value='mechanical';
      const product=mode.value==='parts'?view.print_export:(view.display_export||view.print_export),available=Boolean(product),display=product&&product===view.display_export;
      el('print-format').disabled=!available;link.hidden=!available;
      if(available){link.href=product.formats[format];link.download=selected.id+'-'+view.setting+'-'+format+'-'+(display?'display':'parts')+'.zip';link.textContent=display?'Download static display + checks':'Download panel parts + checks';el('print-note').textContent=display?'Geometry checks passed: one closed fixed-pose solid, '+product.thickness_mm+' mm added wall thickness. Rigid fused panels; folding and strength are not validated. Printer/material, supports and slicing profile are not decided.':('Geometry checks passed: '+product.parts+' separate solid panels, '+product.thickness_mm+' mm thick. Static kit: hinges, guide and springs are not designed. Printer profile unconfirmed. Each format includes individual parts and the audit manifest.');}
      else el('print-note').textContent='No checked solid export is prepared for this configuration. JSON and the surface view remain available. CAD export requires a separate finite-thickness geometry check.';
      if(mode.value==='parts')el('geometry-note').textContent='Flat layout of the checked solid panels. The metrics describe the source mechanical configuration; these disconnected parts do not reproduce its mechanics.';
      if(mode.value==='display'){el('geometry-note').textContent='Actual CAD tessellation of the checked, fused static display. Added thickness and rigid joins are outside the mechanical model; metrics refer to the source configuration.';el('legend').textContent='One fused display solid';el('status').textContent='Fixed-pose CAD display | Source setting '+view.setting+' | Source local stability does not establish display mechanics';}
    }
    function draw(){
      if(!view)return;
      const rect=canvas.getBoundingClientRect(),ratio=window.devicePixelRatio||1;canvas.width=Math.round(rect.width*ratio);canvas.height=Math.round(rect.height*ratio);ctx.setTransform(ratio,0,0,ratio,0,0);ctx.clearRect(0,0,rect.width,rect.height);
      const sceneMesh=el('geometry-view').value==='display'&&view.display_mesh?view.display_mesh:(el('geometry-view').value==='parts'&&view.print_mesh?view.print_mesh:view.mesh);
      const vertices=sceneMesh.vertices_mm;let min=[Infinity,Infinity,Infinity],max=[-Infinity,-Infinity,-Infinity];vertices.forEach(v=>v.forEach((x,i)=>{min[i]=Math.min(min[i],x);max[i]=Math.max(max[i],x)}));
      const center=min.map((x,i)=>(x+max[i])/2),extent=Math.max(...max.map((x,i)=>x-min[i]),1),scale=Math.min(rect.width,rect.height)*.75/extent*zoom;
      const project=p=>{const a=p.map((x,i)=>x-center[i]);const x=Math.cos(yaw)*a[0]-Math.sin(yaw)*a[1],depth=Math.sin(yaw)*a[0]+Math.cos(yaw)*a[1];return [rect.width/2+panX+scale*x,rect.height/2+panY-scale*(Math.cos(pitch)*a[2]-Math.sin(pitch)*depth),Math.sin(pitch)*a[2]+Math.cos(pitch)*depth]};
      const projected=vertices.map(project),palette=colors();
      if(sceneMesh.triangles){
        const faces=sceneMesh.triangles.map((f,i)=>({f,i,z:f.reduce((s,n)=>s+projected[n][2],0)/3})).sort((a,b)=>a.z-b.z);
        for(const face of faces){const p=face.f.map(i=>projected[i]);ctx.beginPath();p.forEach((v,i)=>i?ctx.lineTo(v[0],v[1]):ctx.moveTo(v[0],v[1]));ctx.closePath();ctx.globalAlpha=.23;ctx.fillStyle=palette[(sceneMesh.face_cells?sceneMesh.face_cells[face.i]:Math.floor(face.i/12))%4];ctx.fill();ctx.globalAlpha=.8;ctx.strokeStyle=css('--foreground');ctx.lineWidth=.7;ctx.stroke()}
      }else{
        ctx.globalAlpha=.9;ctx.strokeStyle=css('--viz-series-1');ctx.lineWidth=1.7;
        for(const line of view.mesh.initial_lines){ctx.setLineDash([]);ctx.beginPath();line.map(project).forEach((v,i)=>i?ctx.lineTo(v[0],v[1]):ctx.moveTo(v[0],v[1]));ctx.stroke()}
        ctx.strokeStyle=css('--viz-series-2');ctx.setLineDash([5,4]);
        for(const line of view.mesh.deformed_lines){ctx.beginPath();line.map(project).forEach((v,i)=>i?ctx.lineTo(v[0],v[1]):ctx.moveTo(v[0],v[1]));ctx.stroke()}
        ctx.setLineDash([]);
      }
      ctx.globalAlpha=1;ctx.fillStyle=css('--foreground');ctx.font='12px system-ui';ctx.fillText('x/y/z geometry in mm',12,20);
      const base=project([min[0],min[1],min[2]]),length=extent*.15;
      ['x','y','z'].forEach((label,i)=>{const end=[min[0],min[1],min[2]];end[i]+=length;const p=project(end);ctx.strokeStyle=css('--muted-foreground');ctx.beginPath();ctx.moveTo(base[0],base[1]);ctx.lineTo(p[0],p[1]);ctx.stroke();ctx.fillText(label,p[0]+3,p[1]-3)});
    }
    function plot(){
      const svg=el('energy');svg.replaceChildren();if(family==='linear'){svg.style.display='none';return}svg.style.display='block';
      if(!window.d3){setTimeout(plot,250);return}
      const profile=selected.profiles.find(p=>p.setting===view.setting);if(!profile||!profile.points.length)return;
      const width=svg.getBoundingClientRect().width,height=240;svg.setAttribute('viewBox',`0 0 ${width} ${height}`);
      const margin={left:70,right:22,top:20,bottom:50};let [lo,hi]=d3.extent(profile.points,p=>p[1]);const padding=Math.max((hi-lo)*.08,.1);lo-=padding;hi+=padding;
      const x=d3.scaleLinear().domain(d3.extent(profile.points,p=>p[0])).range([margin.left,width-margin.right]),y=d3.scaleLinear().domain([lo,hi]).range([height-margin.bottom,margin.top]);
      const chart=d3.select(svg);chart.append('rect').attr('data-chart-frame','').attr('x',margin.left).attr('y',margin.top).attr('width',width-margin.left-margin.right).attr('height',height-margin.top-margin.bottom).attr('fill','none').attr('stroke',css('--border'));
      chart.append('g').attr('transform',`translate(0,${height-margin.bottom})`).call(d3.axisBottom(x).ticks(width<420?3:5));chart.append('g').attr('transform',`translate(${margin.left},0)`).call(d3.axisLeft(y).ticks(4));
      chart.append('path').datum(profile.points).attr('d',d3.line().x(p=>x(p[0])).y(p=>y(p[1]))).attr('fill','none').attr('stroke',css('--viz-series-1')).attr('stroke-width',2);
      chart.append('text').attr('class','axis-title').attr('data-axis','x').attr('x',(margin.left+width-margin.right)/2).attr('y',height-8).attr('text-anchor','middle').text('Target to opposite configuration (fraction)');
      chart.append('text').attr('class','axis-title').attr('data-axis','y').attr('transform',`translate(16,${height/2}) rotate(-90)`).attr('text-anchor','middle').text('Energy (mJ)');
    }
    el('family').addEventListener('change',e=>{family=e.target.value;populate()});el('candidate').addEventListener('change',e=>choose(e.target.value));el('state').addEventListener('change',e=>{view=selected.views[Number(e.target.value)];update()});
    el('reset').addEventListener('click',()=>{yaw=-.65;pitch=.32;zoom=1;panX=0;panY=0;draw()});
    el('orbit').addEventListener('click',()=>{yaw+=.35;draw()});el('zoom-in').addEventListener('click',()=>{zoom=Math.min(8,zoom*1.2);draw()});el('zoom-out').addEventListener('click',()=>{zoom=Math.max(.25,zoom/1.2);draw()});
    el('export').addEventListener('click',()=>{const blob=new Blob([JSON.stringify({candidate:selected,selected_configuration:view,viewer_coordinate_rounding_mm:data.viewer_coordinate_rounding_mm,source_states_and_CAD_files:'full precision'},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=selected.id+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)});
    el('print-format').addEventListener('change',updateExport);el('geometry-view').addEventListener('change',()=>{yaw=el('geometry-view').value==='parts'?0:-.65;pitch=el('geometry-view').value==='parts'?1.4:.32;zoom=el('geometry-view').value==='parts'?1.4:1;panX=0;panY=0;update();draw()});
    el('print-download').addEventListener('click',event=>{event.preventDefault();const link=el('print-download');if(!link.hidden)window.parent.postMessage({type:'verified-cad-download',asset:link.getAttribute('href')},'*');});
    canvas.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,pan:e.shiftKey};canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(drag.pan){panX+=dx;panY+=dy}else{yaw+=dx*.008;pitch=Math.max(-1.4,Math.min(1.4,pitch+dy*.008))}drag.x=e.clientX;drag.y=e.clientY;draw()});canvas.addEventListener('pointerup',()=>drag=null);canvas.addEventListener('pointercancel',()=>drag=null);
    canvas.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(.25,Math.min(8,zoom*Math.exp(-e.deltaY*.001)));draw()},{passive:false});
    new ResizeObserver(()=>{draw();plot()}).observe(el('scene'));new MutationObserver(()=>{paletteCache.clear();draw();plot()}).observe(document.documentElement,{attributes:true,attributeFilter:['class','style','data-theme']});
    const saved=window.openai?.widgetState?.privateContent;family=saved?.release===2&&['linear','nonlinear','robust'].includes(saved?.family)?saved.family:'robust';el('family').value=family;populate();
  })();
  </script>
</div>
